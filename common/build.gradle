plugins {
    id 'net.fabricmc.fabric-loom' version "$fabric_loom_version"
    id 'java'
}

sourceSets {
    datagen {
        compileClasspath += main.output
        compileClasspath += main.compileClasspath
        runtimeClasspath += main.runtimeClasspath
        java {

        }
    }
}

repositories {
    maven {
        name = 'ParchmentMC'
        url = 'https://maven.parchmentmc.org'
    }
}

dependencies {
    minecraft "com.mojang:minecraft:$minecraft_version"

    implementation "net.fabricmc.fabric-api:fabric-api:$fabric_api_version"

    sourceSets.named('datagen') {
        implementation "net.fabricmc:fabric-loader:$fabric_loader_version"
    }
}

base {
    archivesName = "$archives_name-$project.name"
}

java {
    withSourcesJar()
}

jar {
    manifest {
        attributes.put('FMLModType', 'GAMELIBRARY')
        attributes.put('Automatic-Module-Name', 'deermodcommon')
    }
}

fabricApi {
    configureDataGeneration {
        client = true
    }
}

loom {
    runs {
        it.getNames().forEach { println it}
        datagen {
            source = sourceSets.datagen
        }
    }
}