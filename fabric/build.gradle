plugins {
    id 'java'
    id 'fabric-loom' version '1.10-SNAPSHOT'
}

repositories {
    maven {
        name = "Terraformers"
        url = "https://maven.terraformersmc.com/"
    }
}

configurations {
    fatJar {
        canBeResolved = true
        canBeConsumed = false
    }

    compileClasspath.extendsFrom fatJar
    runtimeClasspath.extendsFrom fatJar
    developmentFabric.extendsFrom fatJar
}

dependencies {
    minecraft "com.mojang:minecraft:$minecraft_version"
    mappings loom.officialMojangMappings()

    fatJar implementation(project(path: ':common', configuration: 'namedElements'))
    modImplementation "net.fabricmc:fabric-loader:$fabric_loader_version"
    modImplementation "net.fabricmc.fabric-api:fabric-api:$fabric_api_version"
    modImplementation "com.terraformersmc:modmenu:$modmenu_version"
}

base {
    archivesName = "$archives_name-$project.name"
}

processResources {
    var commonSourceSets = project(':common')
            .getExtensions()
            .getByType(JavaPluginExtension.class)
            .getSourceSets();

    from commonSourceSets.main.resources.asFileTree

    replaceProperties.compute('authors', (key, val) ->
        (val as String).split(',').collect(str -> '"' + str.trim() + '"'))

    replaceProperties['fabric_loader_version'] = fabric_loader_version

    inputs.properties replaceProperties

    filesMatching('fabric.mod.json') {
        expand replaceProperties
    }
}

jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    from {
        configurations.fatJar.collect {
            it.isDirectory() ? it : zipTree(it)
        }
    }
}