plugins {
    id 'java'
    id 'fabric-loom' version '1.10-SNAPSHOT'
}

base {
    archivesName = "$archives_name-$project.name"
}

repositories {
    maven {
        name = "Terraformers"
        url = "https://maven.terraformersmc.com/"
    }
}

configurations {
    fatJar {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    minecraft "com.mojang:minecraft:$minecraft_version"
    mappings loom.layered() {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-$parchment_mappings_version@zip")
    }

    fatJar implementation(files(project(':common').tasks.jar))
    modImplementation "net.fabricmc:fabric-loader:$fabric_loader_version"
    modImplementation "net.fabricmc.fabric-api:fabric-api:$fabric_api_version"
}

processResources {
    from project(':common').tasks.processResources

    replaceProperties.compute('authors', (key, val) ->
        (val as String).split(',').collect(str -> '"' + str.trim() + '"'))

    replaceProperties['fabric_loader_version'] = fabric_loader_version

    inputs.properties replaceProperties

    filesMatching('fabric.mod.json') {
        expand replaceProperties
    }
}

jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    from {
        configurations.fatJar.collect {
            it.isDirectory() ? it : zipTree(it)
        }
    }
}